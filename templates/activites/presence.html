{% extends 'base/base.html' %}
{% load static %}

{% block titre %}Présences{% endblock %}

{% block contenu %}
<h4 class="fw-bold mb-4">Prise de présence</h4>

<div class="carte p-4 mb-4">
    <div class="row g-2">
        <div class="col-md-6">
            <label class="form-label small fw-medium">Activité</label>
            <select class="form-select" id="select-activite-presence">
                <option value="">Sélectionnez une activité</option>
            </select>
        </div>
    </div>
</div>

<div class="carte p-4 d-none" id="conteneur-presence">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-semibold mb-0" id="titre-activite-selectionnee"></h6>
        <div class="d-flex gap-3 small">
            <span class="text-success"><i class="bi bi-circle-fill" style="font-size: 0.5rem;"></i> Présent : <span id="compteur-presents">0</span></span>
            <span class="text-danger"><i class="bi bi-circle-fill" style="font-size: 0.5rem;"></i> Absent : <span id="compteur-absents">0</span></span>
        </div>
    </div>

    <table class="table">
        <thead>
            <tr class="text-muted small text-uppercase">
                <th>Élève</th><th>Classe</th><th>Statut</th>
            </tr>
        </thead>
        <tbody id="tableau-presences"></tbody>
    </table>

    <button class="btn btn-primaire-app" id="btn-enregistrer-presences">
        <i class="bi bi-check-lg me-1"></i>Enregistrer la présence
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/presences.js' %}"></script>
{% endblock %}
