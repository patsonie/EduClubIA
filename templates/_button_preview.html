<!-- Aperçu des boutons pour vérification visuelle -->
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aperçu boutons</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>body{padding:2rem; font-family:Inter,system-ui,Arial;} .row{display:flex;gap:1rem;flex-wrap:wrap}</style>
</head>
<body>
  <h2>Aperçu boutons</h2>
  <div class="row">
    <button class="btn btn-primaire">Primaire <span class="icone-btn">★</span></button>

    <button class="btn btn-outline">Outline</button>

    <button class="btn btn-primaire btn-lg btn-pulse">Large pulse</button>

  <p style="margin-top:1.5rem;color:var(--couleur-texte-secondaire)">Testez les hover, focus et active.</p>
