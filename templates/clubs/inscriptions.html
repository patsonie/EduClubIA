{% extends 'base/base.html' %}
{% load static %}

{% block titre %}Inscriptions{% endblock %}

{% block contenu %}
<h4 class="fw-bold mb-4">Inscriptions</h4>

<ul class="nav nav-pills gap-2 mb-3" id="filtre-inscriptions">
    <li class="nav-item"><button class="btn-filtre active" data-statut="en_attente">En attente</button></li>
    <li class="nav-item"><button class="btn-filtre" data-statut="validee">Validées</button></li>
    <li class="nav-item"><button class="btn-filtre" data-statut="refusee">Refusées</button></li>
    <li class="nav-item"><button class="btn-filtre" data-statut="">Toutes</button></li>
</ul>

<div class="carte">
    <table class="table mb-0">
        <thead>
            <tr class="text-muted small text-uppercase">
                <th>Élève</th><th>Club</th><th>Date de demande</th><th>Statut</th><th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableau-inscriptions">
            <tr><td colspan="5" class="text-center text-muted py-4">Chargement...</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/inscriptions.js' %}"></script>
{% endblock %}
