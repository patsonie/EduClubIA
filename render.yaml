# Blueprint Render pour EduClubIA.
# Un seul service web (Daphne sert HTTP + WebSocket) + base PostgreSQL.
# Pour plusieurs instances : ajouter un service Redis et définir REDIS_URL.
services:
  - type: web
    name: educlubia
    runtime: python
    plan: starter            # le plan gratuit n'a pas de disque persistant
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /connexion/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: educlubia-db
          property: connectionString
      # Nom d'hôte injecté automatiquement par Render : alimente ALLOWED_HOSTS, CORS,
      # FRONTEND_BASE_URL et NUM_PROXIES.
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
      # Compte administrateur créé au premier déploiement (bootstrap_admin)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Email : sans SMTP, les codes et liens sont affichés dans les logs (backend console).
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Fichiers : disque persistant monté sur /var/data (ci-dessous) OU stockage S3.
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: IA_MODELES_DIR
        value: /var/data/ia_modeles
    disk:
      name: educlubia-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: educlubia-db
    plan: free
