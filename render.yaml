# Blueprint Render pour EduClubIA.
# Un seul service web (Daphne sert HTTP + WebSocket) ; base PostgreSQL externe (DATABASE_URL).
# Pour plusieurs instances : ajouter un service Redis et définir REDIS_URL.
services:
  - type: web
    name: educlubia
    runtime: python
    plan: free               # pas de disque persistant ni de shell : fichiers envoyés éphémères (voir README)
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /connexion/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Base PostgreSQL externe sans expiration (ex. Neon) : coller l'URL de connexion dans Render,
      # terminée par ?sslmode=require. Ne jamais la committer.
      - key: DATABASE_URL
        sync: false
      # Nom d'hôte injecté automatiquement par Render : alimente ALLOWED_HOSTS, CORS,
      # FRONTEND_BASE_URL et NUM_PROXIES.
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
      # Compte administrateur créé au premier déploiement (bootstrap_admin)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Email : le backend SMTP est activé automatiquement dès que EMAIL_HOST est défini ;
      # sans EMAIL_HOST, les codes et liens sont seulement affichés dans les logs.
      # Port 2525 : les instances gratuites de Render bloquent les ports SMTP 25/465/587
      # (Brevo accepte 2525 avec STARTTLS).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Fichiers : le disque du plan gratuit est effacé à chaque déploiement/redémarrage.
      # Pour conserver photos et justificatifs, utiliser un stockage S3 compatible
      # (AWS_STORAGE_BUCKET_NAME, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT_URL).
